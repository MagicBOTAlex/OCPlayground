name: example

memory: 512

cpu:
  tier: 2

gpu:
  tier: 3
  screen:
    width: 80
    height: 25
    maxDepth: 8

eeprom:
  bios: builtin
  boot: auto

filesystems:
  - label: openos
    path: builtin
    mount: /
    readonly: false

components:
  keyboard: true
  mouse: true

internet:
  enabled: true
  # HTTP request timeout in seconds; 0 = no timeout.
  timeout: 30
  # TCP sockets are not implemented yet.
  tcp: false
  userAgent: opencomputers/ocplay

run:
  timeout: 0
  interactive: false
  # Seconds to keep the final screen visible after the machine stops.
  terminateDelay: 5
